version: '3.8'

services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mongo_db
  mongo_db:
    image: mongo
    env_file:
      - .env
    restart: always
    environment:
      MONGO_INITDB_DATABASE: $MONGODB_NAME
      MONGO_INITDB_ROOT_USERNAME: $MONGODB_USER
      MONGO_INITDB_ROOT_PASSWORD: $MONGODB_PASSWORD
    ports:
      - "27017:27017"
    volumes:
      - ranking-mongo-db:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

volumes:
  ranking-mongo-db:
    external: true
